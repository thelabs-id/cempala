name: verify

# Two things this exists to do, both of which are impossible from a single
# developer machine:
#
#   1. Run the test suite on POSIX. A good part of the suite only means
#      something off Windows — the spawnDetached survival test is skipped on
#      Windows by design, so until this workflow existed it had never actually
#      executed anywhere.
#
#   2. Smoke-test the release binaries on matching hardware. A cross-compiled
#      binary proves nothing until it has been run on the platform it targets,
#      which is what blocks publishing the macOS and Linux artifacts. The
#      binaries are built ONCE and then shipped to each runner, so what gets
#      tested is the exact artifact that would be released — not a fresh
#      per-platform build that happens to work.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Track the supported Bun floor. Pinned rather than `latest` so a release
  # artifact is reproducible and a Bun upgrade can't silently change it.
  BUN_VERSION: "1.3.14"

jobs:
  test:
    name: unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Unit tests
        run: bun test
        # AC-12 needs a real symlink. On Windows that requires Developer Mode
        # or elevation; the test skips loudly rather than passing silently.

  installer:
    name: installer tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - uses: actions/checkout@v4
      # macos-15 is the load-bearing entry, not a nicety. `curl … | bash` on a
      # Mac runs bash 3.2, whose handling of empty arrays under `set -u`
      # differs from every bash a developer is likely to have locally — that
      # exact difference once broke the installer for every macOS user after
      # the claude registration and before the codex one.
      - name: Installer tests
        run: bash scripts/test-install.sh

  build:
    name: build all targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Cross-compile six targets + checksums
        run: bash scripts/build-all.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
          # Already-compiled binaries do not compress usefully; skipping it
          # saves several minutes per run.
          compression-level: 0

  smoke:
    name: smoke ${{ matrix.asset }} on ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: cempala-linux-x64
          - os: ubuntu-24.04-arm
            asset: cempala-linux-arm64
          # Runner labels for macOS move faster than you'd expect: `macos-13`
          # is retired and `macos-14` deprecated. A retired label does not
          # fail — the job simply queues forever, so it reads as "still
          # running" rather than "misconfigured". Both of these are GA; check
          # actions/runner-images before changing them.
          - os: macos-15-intel # Intel
            asset: cempala-darwin-x64
          - os: macos-15 # Apple Silicon
            asset: cempala-darwin-arm64
          - os: windows-latest
            asset: cempala-windows-x64.exe
          # windows-arm64 has no entry because there is no second Windows
          # architecture to test it on here. GitHub does offer a `windows-11-arm`
          # runner for public repositories; add it as another entry once you
          # have confirmed it is available to this repo, and drop the ARM64
          # emulation fallback in scripts/install.ps1 at the same time.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Verify the checksum before running anything
        shell: bash
        run: |
          cd dist
          # macOS ships no sha256sum; same fallback order as install.sh.
          if command -v sha256sum >/dev/null 2>&1; then
            actual=$(sha256sum "${{ matrix.asset }}" | awk '{print $1}')
          elif command -v shasum >/dev/null 2>&1; then
            actual=$(shasum -a 256 "${{ matrix.asset }}" | awk '{print $1}')
          else
            actual=$(openssl dgst -sha256 "${{ matrix.asset }}" | awk '{print $NF}')
          fi
          expected=$(grep -E "  ${{ matrix.asset }}\$" checksums.txt | awk '{print $1}')
          echo "expected: $expected"
          echo "actual:   $actual"
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "checksum mismatch or missing entry for ${{ matrix.asset }}" >&2
            exit 1
          fi
      - name: Smoke test on matching hardware
        shell: bash
        run: bash scripts/smoke-test.sh "dist/${{ matrix.asset }}"
